name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find ZIP, extract, and build debug APK
        id: build_step
        run: |
          mkdir -p extracted_project

          ZIP_FILE=$(find . -maxdepth 4 -not -path '*/.*' -not -path './extracted_project*' -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in repository."
            exit 1
          fi

          echo "Found ZIP file: $ZIP_FILE"
          ZIP_BASENAME=$(basename "$ZIP_FILE" .zip)
          ARTIFACT_NAME="${ZIP_BASENAME}-APK"
          echo "Auto-set artifact name: $ARTIFACT_NAME"

          unzip -q -o "$ZIP_FILE" -d extracted_project

          GRADLEW_PATH=$(find . -maxdepth 5 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found inside extracted project."
            find . -maxdepth 5
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew

          if [ -f "gradle.properties" ]; then
            sed -i '/org.gradle.configuration-cache/d' gradle.properties
            echo "org.gradle.configuration-cache=false" >> gradle.properties
          fi

          ./gradlew assembleDebug --no-daemon --no-configuration-cache

          APK_FOUND=$(find "$GITHUB_WORKSPACE" -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: APK file was not generated."
            exit 1
          fi

          echo "APK built at: $APK_FOUND"
          echo "apk_path=$APK_FOUND" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_step.outputs.artifact_name }}
          path: ${{ steps.build_step.outputs.apk_path }}
